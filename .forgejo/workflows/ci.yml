name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_HACK_VERSION: 0.6.45

jobs:
  check:
    runs-on: docker
    # Node is required by JavaScript actions (checkout, cache); Rust is installed below.
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-hack
        run: |
          curl -sSfL "https://github.com/taiki-e/cargo-hack/releases/download/v${CARGO_HACK_VERSION}/cargo-hack-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-

      # rust-toolchain.toml selects the toolchain and its components.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Feature combinations
        run: cargo hack check --feature-powerset --depth 2

  compile-bench:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Each run saves its results under its own key; restoring by prefix gives the latest one.
      - uses: actions/cache@v4
        with:
          path: bench-results
          key: bench-${{ github.sha }}
          restore-keys: bench-

      - name: Measure compile times
        run: |
          cargo build --release -p compile-bench
          target/release/compile-bench bench/placeholder \
            --baseline bench-results/last.txt --out bench-results/last.txt
