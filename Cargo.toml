[workspace]
members = ["crates/*", "bench/compile-bench", "bench/web-template", "tools/release-age", "tools/release"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/balise-rs/balise"
# Crates published to crates.io set `publish = true`; everything else stays private.
publish = false

[workspace.dependencies]
balise = { path = "crates/balise", version = "=0.1.0-alpha.1" }
balise-core = { path = "crates/balise-core", version = "=0.1.0-alpha.1" }
balise-macros = { path = "crates/balise-macros", version = "=0.1.0-alpha.1" }
balise-engine = { path = "crates/balise-engine", version = "=0.1.0-alpha.1" }
balise-realtime = { path = "crates/balise-realtime" }
balise-ts = { path = "crates/balise-ts" }
balise-orm = { path = "crates/balise-orm" }
balise-auth = { path = "crates/balise-auth" }
balise-mail = { path = "crates/balise-mail" }
balise-dev = { path = "crates/balise-dev" }

# Delegated: never exposed by the facade.
bytes = "1.12"
http-body-util = "0.1.5"
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-graceful", "http1"] }
linkme = "0.3.37"
serde_json = "1.0.151"
# Only to read balise.toml, with positions for error messages.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }

# Procedural macros
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }

# Tests
trybuild = "1.0.121"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync", "signal"] }

