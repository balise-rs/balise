[workspace]
members = ["crates/*", "bench/compile-bench", "tools/release-age"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/balise-rs/balise"
publish = false

[workspace.dependencies]
balise-core = { path = "crates/balise-core" }
balise-macros = { path = "crates/balise-macros" }
balise-engine = { path = "crates/balise-engine" }
balise-realtime = { path = "crates/balise-realtime" }
balise-ts = { path = "crates/balise-ts" }
balise-orm = { path = "crates/balise-orm" }
balise-auth = { path = "crates/balise-auth" }
balise-mail = { path = "crates/balise-mail" }
balise-dev = { path = "crates/balise-dev" }

# Delegated: never exposed by the facade.
bytes = "1.12"
http-body-util = "0.1.5"
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
linkme = "0.3.37"

# Procedural macros
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }

# Tests
trybuild = "1.0.121"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time"] }

