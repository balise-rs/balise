[package]
name = "balise-cli"
description = "The Balise command-line tool, one version per Balise release; run it through `balise`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "balise-cli"
path = "src/main.rs"

[dependencies]
balise-core.workspace = true

# Sending SIGTERM to the app and catching Ctrl-C in `balise dev`.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
