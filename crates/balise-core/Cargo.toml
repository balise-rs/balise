[package]
name = "balise-core"
description = "Routing, extractors, errors, logs and configuration for Balise"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[features]
# Reading uploads and storing files. The engine enables it; the macros, which only need the
# error codes and declarations, do not, so that Tokio is not compiled for them too.
runtime = ["dep:tokio"]

[dependencies]
linkme.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
toml.workspace = true
