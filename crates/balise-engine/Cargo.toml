[package]
name = "balise-engine"
description = "HTTP engine wrapper for Balise: startup and shutdown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[features]
# Dev tooling: the watch on tasks that hold the event loop.
dev = ["balise-core/dev"]

[dependencies]
balise-core = { workspace = true, features = ["runtime"] }
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "io-util"] }
