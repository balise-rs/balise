[package]
name = "balise"
description = "Rust web framework designed for AI coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
orm = ["dep:balise-orm"]
auth = ["dep:balise-auth"]
mail = ["dep:balise-mail"]
dev = ["dep:balise-dev"]
# Test builds: counters for budgets.
test = []
full = ["orm", "auth", "mail"]

[dependencies]
balise-core.workspace = true
balise-macros.workspace = true
balise-engine.workspace = true
balise-realtime.workspace = true
balise-ts.workspace = true
balise-orm = { workspace = true, optional = true }
balise-auth = { workspace = true, optional = true }
balise-mail = { workspace = true, optional = true }
balise-dev = { workspace = true, optional = true }

[dev-dependencies]
balise-core.workspace = true
balise-engine.workspace = true
tokio = { workspace = true, features = ["macros", "io-util"] }
trybuild.workspace = true
