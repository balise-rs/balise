[package]
name = "shop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Optional modules, all enabled by `balise new` unless refused (`--no-orm`, `--no-auth`, `--no-mail`).
balise = { version = "0.1", features = ["orm", "auth", "mail"] }

# Enabled by `balise dev`. A release build never has it.
[features]
dev = ["balise/dev"]

# Test tooling (TestApp, factories) for `cargo test` and `balise test` only.
[dev-dependencies]
balise = { version = "0.1", features = ["orm", "auth", "mail", "test"] }

[lints.rust]
deprecated = "deny"

[lints.clippy]
await_holding_lock = "deny"

# Fast edit-compile loop: dependencies optimized once, your code compiled quickly.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
